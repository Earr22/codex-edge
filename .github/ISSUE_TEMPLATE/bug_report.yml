name: Bug report
description: Report a reproducible Codex Edge installation or connection failure.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test Codex Edge. Never attach cookies, tokens, passwords, signed-in page content, browser profiles, or unredacted full local paths.
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other / unsupported
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex Desktop version
      placeholder: "Example: 0.1.x"
    validations:
      required: true
  - type: input
    id: edge
    attributes:
      label: Microsoft Edge version
      placeholder: "edge://settings/help (version number only)"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a public, non-authenticated page when possible.
      placeholder: |
        1. Installed with...
        2. Restarted Codex Desktop...
        3. Opened a new task...
        4. Observed...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Redacted doctor output
      description: Paste only the default redacted output. Do not use raw-path output in a public issue.
      render: json
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed usernames, full local paths, cookies, tokens, passwords, browser profiles, and signed-in page content.
          required: true
        - label: I did not enable `NODE_REPL_TRUST_ALL_CODE` or bypass a Codex confirmation.
          required: true
